# OpenRaven graphics settings. Delete this file to get the game's arcade defaults.
# UPPER-CASE keys are engine settings (applied by ravengfx.so); lower-case keys are launcher options.
# Screen resolution: WxH or "native" (matches your display). ./play_halo.sh WxH overrides it.
resolution = native

# Upscaling: 'off' uses native rendering + TAA/SMAA. Set to 'fsr2' for AMD FSR 2 upscaling.
UPSCALER = off
FSR_QUALITY = quality
FSR_SHARPNESS = 0.5

# Frame generation: off by default
FRAME_GEN = off
FG_MODE = interpolate

# Texture filtering (game default 8, 16 for sharper textures)
ANISOTROPY_LEVEL = 16

# Shadows (arcade defaults: 2048 / 2048 / 2 splits)
SHADOW_SIZE = 2048
STATIC_SHADOW_SIZE = 2048
SHADOW_SPLITS = 2
ENABLE_STABLE_SHADOW = 1

# Screen-space reflections (arcade default 0.5)
SSR_BUFFER_SCALE = 0.5

# Post effects
ENABLE_SSAO = 1
ENHANCED_BLOOM = 0
RENDER_SCALE = 1.0000
ENABLE_TAA = 1
ENABLE_LENS_FLARE = 1
FPS_CAP = 0
VSYNC = 1
volume = 100%
stick_speed = 0.5
