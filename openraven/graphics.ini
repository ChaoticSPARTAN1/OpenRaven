# OpenRaven graphics settings (also editable in-game with F1). Delete this file to get the game's arcade defaults.
# UPPER-CASE keys are engine settings; lower-case keys are launcher options.
# Defaults: maximum quality, FSR 2 at native resolution as anti-aliasing, frame generation and neural pass off.

# Screen resolution: WxH or "native" (your desktop size).
resolution = native
# First launch: detect the main display (Windows: HDR on/off and peak nits) and save them here, then set to 0.
autodetect = 1
RENDER_SCALE = 1.0
VSYNC = 1
FPS_CAP = 0

# Anti-aliasing: FSR 2 at native = temporal AA at full resolution (no upscaling).
# FSR 2 runs in place of the engine's TAA pass, so ENABLE_TAA stays 1 (it is replaced, not added).
# Slow GPU? Set FSR_QUALITY = quality / balanced / performance to render at a lower resolution.
UPSCALER = fsr2
FSR_QUALITY = native
FSR_SHARPNESS = 0.3
ENABLE_TAA = 1

# Frame generation (2x/3x/4x adds frames only when the game falls below the screen's refresh rate).
FRAME_GEN = off
FG_MODE = interpolate

# Neural detail pass (experimental, Linux only for now)
NEURAL = 0

# Textures, shadows, reflections: maximum
ANISOTROPY_LEVEL = 16
SHADOW_SIZE = 8192
STATIC_SHADOW_SIZE = 8192
SHADOW_SPLITS = 4
ENABLE_STABLE_SHADOW = 1
SSR_BUFFER_SCALE = 1.0

# Post effects
ENABLE_SSAO = 1
ENABLE_LENS_FLARE = 1
# Enhanced bloom is broken in the engine (attract/menu scenes go white), so it stays off.
ENHANCED_BLOOM = 0

# Native HDR10. Windows: needs "Use HDR" on in display settings. Linux: needs HDR on in the desktop
# (KDE Plasma 6) and gamescope installed (the game then runs inside it). Set on first launch
# from the display (autodetect). The game's own highlights are kept in 16-bit float.
HDR = 0
# Display peak and SDR-white brightness in nits.
HDR_PEAK = 1000
HDR_PAPERWHITE = 203
# How far highlights go above SDR white: 0.5 = the game's filmic curve, 0 = SDR look.
HDR_HIGHLIGHTS = 0.5
