# ALSA config for the sandbox (installed as ~/.asoundrc by play_halo.sh).
# The game opens "plug:surround51" / "plug:surround40" (the cabinet's USB 5.1 card). PipeWire's
# own 5.1 -> stereo downmix is very quiet, so fold the channels into stereo here at full level.
# ALSA channel order: 0 FL, 1 FR, 2 RL, 3 RR, 4 FC, 5 LFE.
# Gains are 2x: the cabinet drives an external amp, so the game's line level is low.
pcm.!default { type pipewire }
ctl.!default { type pipewire }

pcm.halo_stereo {
    type plug
    slave { pcm { type pipewire } channels 2 }
}

pcm.!surround51 {
    type route
    slave { pcm "halo_stereo" channels 2 }
    ttable.0.0 2
    ttable.1.1 2
    ttable.2.0 2
    ttable.3.1 2
    ttable.4.0 2
    ttable.4.1 2
    ttable.5.0 1.4
    ttable.5.1 1.4
}

pcm.!surround40 {
    type route
    slave { pcm "halo_stereo" channels 2 }
    ttable.0.0 2
    ttable.1.1 2
    ttable.2.0 2
    ttable.3.1 2
}
