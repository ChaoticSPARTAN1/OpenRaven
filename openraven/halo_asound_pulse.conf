# Fallback ALSA config when PipeWire's ALSA plugin isn't active (e.g., PulseAudio / WSLg).
# Folds 5.1/4.0 surround into stereo with clean balanced gains (avoids digital clipping).
pcm.!default { type pulse }
ctl.!default { type pulse }

pcm.halo_stereo {
    type plug
    slave { pcm { type pulse } channels 2 }
}

pcm.!surround51 {
    type route
    slave { pcm "halo_stereo" channels 2 }
    ttable.0.0 1.0
    ttable.1.1 1.0
    ttable.2.0 0.7
    ttable.3.1 0.7
    ttable.4.0 0.7
    ttable.4.1 0.7
    ttable.5.0 0.5
    ttable.5.1 0.5
}

pcm.!surround40 {
    type route
    slave { pcm "halo_stereo" channels 2 }
    ttable.0.0 1.0
    ttable.1.1 1.0
    ttable.2.0 0.7
    ttable.3.1 0.7
}
